<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KI4 VS DOWN — Privado da Down</title>
<style>
:root{--bg:#0f0e14;--card:#191821;--ink:#f3efe8;--mute:#9a95a6;--line:#2a2833;--a1:#e8873f;--a2:#f0c49a;--a3:#e9a595;--lock:#22202b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f6f3ee;--card:#fff;--ink:#1b1a22;--mute:#76727f;--line:#e6e1d8;--lock:#efeae0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,"Segoe UI",system-ui,sans-serif;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:16px 18px;max-width:100%}
.logo{font-weight:700;font-size:28px;letter-spacing:-1px;text-align:center}.logo i{color:var(--a1);font-style:normal}.logo .lg{height:30px;width:auto;display:block;margin:0 auto}
.hbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:16px;box-shadow:0 8px 30px -18px rgba(0,0,0,.25)}
.banner{height:140px;background:#2a1f2d url("https://pub-416e46d79470405c994062eece730590.r2.dev/banner.png") center top/cover no-repeat}
.pbody{padding:0 20px 20px;position:relative}
.avatar{width:76px;height:76px;border-radius:50%;margin-top:-38px;border:4px solid var(--card);background:linear-gradient(135deg,var(--a1),var(--a3));display:grid;place-items:center;color:#fff;font-weight:700;font-size:28px}
.stats{position:absolute;right:20px;top:12px;display:flex;gap:14px;font-size:13px;color:var(--mute)}
h1{font-size:20px;margin:10px 0 0;display:flex;align-items:center;gap:6px}
.vb{width:18px;height:18px;color:#4a7bf0}
.handle{color:var(--mute);font-size:14px}
.bio{font-size:13.5px;margin:10px 0 4px}.bio.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--a1);font:inherit;font-size:13.5px;padding:0;cursor:pointer}
h3{font-size:15px;font-weight:600;margin:20px 0 10px}
.plan{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:30px;padding:15px 24px;margin-bottom:10px;background:linear-gradient(110deg,var(--a1),var(--a2) 55%,var(--a3));color:#2a1a10;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:transform .15s,box-shadow .15s}
.plan:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px var(--a1)}
.plan.on{outline:3px solid var(--ink)}
.promo-h{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-top:18px}
.badge{display:inline-block;background:#1f9d62;color:#fff;border-radius:20px;padding:3px 10px;font-size:12px;margin-left:8px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.tab{flex:1;padding:14px;text-align:center;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.tab.on{color:var(--a1);border-color:var(--a1)}
.ph{display:flex;align-items:center;gap:10px;padding:16px}.ph .avatar{width:44px;height:44px;margin:0;border:0;font-size:16px}
.ph b{font-size:14px;display:block}.ph small{color:var(--mute)}
.txt{padding:0 16px 14px;font-size:14px}
.media{aspect-ratio:1/1;background:var(--lock);display:grid;place-items:center;text-align:center;color:var(--mute);position:relative;overflow:hidden}
.media::before{display:none}
.media>div{position:relative;z-index:1;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.media.open{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff}
.media.open::before{display:none}
.lockic{width:44px;height:44px;margin:0 auto 6px}
.acts{display:flex;justify-content:space-between;padding:12px 16px}
.acts div{display:flex;gap:16px}
.ib{background:none;border:0;color:var(--ink);cursor:pointer;padding:2px;display:flex}.ib svg{width:24px;height:24px}.ib.on{color:#e0435c}.ib.on svg{fill:currentColor}
.unlock{margin-top:10px;background:var(--ink);color:var(--bg);border:0;border-radius:20px;padding:8px 18px;font:inherit;font-size:13px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 4px;font-size:18px}
input,textarea,select{width:100%;padding:12px 14px;margin:6px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
.row{display:flex;gap:8px}
.cta{width:100%;margin-top:10px;padding:14px;border:0;border-radius:30px;background:linear-gradient(110deg,var(--a1),var(--a3));color:#2a1a10;font:inherit;font-weight:600;cursor:pointer}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:24px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:30}.toast.show{opacity:1}
.note{font-size:12px;color:var(--mute);text-align:center;margin:18px 0 30px}

img.avatar{display:block;object-fit:cover}
.pv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.75);transform:scale(1.25);pointer-events:none;user-select:none;-webkit-user-select:none}
.media{-webkit-touch-callout:none;user-select:none}
.lockic{filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
a.plan{text-decoration:none}
.snd{position:absolute;top:10px;right:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
.plan.tg{justify-content:center;margin-top:14px}
</style>
</head>

chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.5A8 8 0 1121 12z"/></svg>',
usd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.4-.8-1.4-1.2-2.5-1.2-1.4 0-2.5.7-2.5 1.800 0 2.600 5 1.400 5 4 0 1.100-1.100 1.800-2.500 1.800-1.100 0-2.200-.5-2.600-1.400M12 6.500v1.500m0 8v1.500"/></svg>',
bm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
lock:'<svg class="lockic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="11" width="14" height="10" rx="2.500"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>'};

function render(){
  $("#stats").innerHTML=`<span>205 fotos</span><span>▶ 49</span><span>♥ ${751+S.likes.length}</span>`;
  document.querySelectorAll(".tab")[0].textContent=POSTS.length+" Postagens";
  document.querySelectorAll(".tab")[1].textContent=(POSTS.length+75)+" Mídias";
  $("#feed").innerHTML=POSTS.map(p=>{
    const meta=p.type==="video"?"▶ 1 vídeo":"1 foto";
    const pv=p.type==="video"
      ?`<video class="pv" src="${p.src}" autoplay muted loop playsinline preload="metadata" disablepictureinpicture controlslist="nodownload noplaybackrate" tabindex="-1"></video>`
      :`<img class="pv" src="${p.src}" alt="" draggable="false">`;
    return `<article class="card"><div class="ph"><img class="avatar" src="${AV}" alt=""><div><b>KI4 VS DOWN</b><small>@ki4vsdown · ${p.d}</small></div></div>
    <div class="txt">${p.t}</div>
    <div class="media" oncontextmenu="return false">${pv}${p.type==="video"?'<button class="snd" data-snd="1" aria-label="Som">🔇</button>':""}<div>${ic.lock}<div style="font-size:13px">${meta} · ♥ ${751+p.id*7}</div>
    <button class="unlock" data-s="1">Assine para ver</button></div></div>
    <div class="acts"><div><button class="ib ${S.likes.includes(p.id)?"on":""}" data-l="${p.id}">${ic.heart}</button><button class="ib" data-c="1">${ic.chat}</button><button class="ib" data-tip="1">${ic.usd}</button></div><button class="ib ${S.saved.includes(p.id)?"on":""}" data-b="${p.id}" style="${S.saved.includes(p.id)?"color:var(--a1)":""}">${ic.bm}</button></div></article>`}).join("");
  applySound();
}
let sound=false;
function applySound(){
  document.querySelectorAll("video.pv").forEach(v=>{
    v.muted=!sound;
    const r=v.play();if(r&&r.catch)r.catch(()=>{v.muted=true;sound=false;v.play().catch(()=>{});syncIcon()});
  });
  syncIcon();
}
function syncIcon(){document.querySelectorAll(".snd").forEach(b=>b.textContent=sound?"🔊":"🔇")}
let autoSound=true;
["pointerdown","touchstart","keydown"].forEach(ev=>document.addEventListener(ev,e=>{
  if(!autoSound)return;autoSound=false;
  if(e.target.closest&&e.target.closest("[data-snd]"))return;
  sound=true;applySound();
},{passive:true}));
document.addEventListener("click",e=>{
  const sb=e.target.closest("[data-snd]");if(sb){autoSound=false;sound=!sound;applySound()}
});
document.addEventListener("click",e=>{
  const t=e.target.closest("button,.promo-h");if(!t)return;const d=t.dataset;
  if(d.s)window.scrollTo({top:0,behavior:"smooth"});
  if(d.l){const i=+d.l;S.likes=S.likes.includes(i)?S.likes.filter(x=>x!==i):[...S.likes,i];save();render()}
  if(d.b){const i=+d.b;S.saved=S.saved.includes(i)?S.saved.filter(x=>x!==i):[...S.saved,i];save();render()}
  if(d.c)toast("Assine para comentar");
  if(d.tip)toast("Assine para enviar um mimo");
  if(d.t){tab=d.t;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));render()}
  if(t.id==="ph"){const p=$("#promos");p.style.display=p.style.display==="none"?"":"none";$("#chev").textContent=p.style.display?"⌄":"⌃"}
});
render();
</script>
</body>
</html>
